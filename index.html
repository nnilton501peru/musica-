<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0c">
    <title>Mauricio · Reproductor</title>
    <style>
        :root {
            --accent: #00ff88;
            --bg: #0a0a0c;
            --surface: #15151a;
            --surface2: #1f1f27;
            --text: #f2f2f5;
            --muted: #8b8b99;
            --glow: #1d1d26;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; width: 100%; background: var(--bg); color: var(--text); overflow: hidden; }
        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            padding-top: env(safe-area-inset-top, 0px);
            accent-color: var(--accent);
        }
        button, input { font-family: inherit; }

        /* Cabecera */
        .top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px 10px;
            flex-shrink: 0;
        }
        .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
        .logo {
            width: 40px; height: 40px; border-radius: 12px;
            background: var(--accent); color: #000;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        h1 { font-size: 17px; font-weight: 700; }
        #count { font-size: 12px; color: var(--muted); margin-top: 2px; }
        .tools { display: flex; gap: 8px; }

        /* Botón genérico de íconos */
        .ib {
            width: 40px; height: 40px; border-radius: 12px; border: none;
            background: var(--surface2); color: var(--text);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; flex-shrink: 0;
            transition: transform 0.15s, color 0.2s;
        }
        .ib:hover { color: var(--accent); }
        .ib:active { transform: scale(0.92); }
        input[type="file"] { display: none; }

        /* Búsqueda */
        .search { position: relative; margin: 0 16px 10px; flex-shrink: 0; }
        .search .s-icon {
            position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
            color: var(--muted); display: flex; pointer-events: none;
        }
        #search {
            width: 100%; padding: 12px 14px 12px 42px;
            border: none; border-radius: 14px;
            background: var(--surface); color: var(--text);
            font-size: 15px; outline: none;
        }
        #search::placeholder { color: var(--muted); }
        #search:focus { box-shadow: 0 0 0 2px var(--accent); }

        /* Lista */
        .list { flex: 1; min-height: 0; overflow-y: auto; padding: 0 8px 8px; -webkit-overflow-scrolling: touch; }
        .row {
            display: flex; align-items: center; gap: 12px;
            padding: 12px 10px; border-radius: 12px; cursor: pointer;
            transition: background 0.15s;
        }
        .row:active { background: var(--surface2); }
        .idx { position: relative; width: 28px; height: 16px; flex-shrink: 0; }
        .num { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
        .eq {
            position: absolute; inset: 0; display: none;
            align-items: flex-end; justify-content: center; gap: 2px;
        }
        .eq i { width: 3px; height: 4px; background: var(--accent); border-radius: 2px; }
        .row.playing .num { display: none; }
        .row.playing .eq { display: flex; }
        .row.playing .eq i { animation: eq 0.9s ease-in-out infinite; }
        .row.playing .eq i:nth-child(2) { animation-delay: 0.2s; }
        .row.playing .eq i:nth-child(3) { animation-delay: 0.4s; }
        @keyframes eq { 0%, 100% { height: 4px; } 50% { height: 16px; } }
        .name {
            flex: 1; min-width: 0; font-size: 15px; color: #d4d4dc;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .row.active .name { color: var(--accent); font-weight: 600; }
        .empty { text-align: center; color: var(--muted); padding: 60px 20px; font-size: 15px; line-height: 1.6; }
        .empty b { display: block; color: var(--text); font-weight: 600; margin-bottom: 4px; font-size: 16px; }

        /* Mini reproductor */
        .mini {
            position: relative; overflow: hidden;
            display: flex; align-items: center; gap: 12px;
            margin: 0 10px 10px; padding: 10px;
            background: var(--surface); border-radius: 16px;
            cursor: pointer; flex-shrink: 0;
        }
        .mini.hidden { display: none; }
        .mini-fill { position: absolute; left: 0; bottom: 0; height: 2px; width: 0; background: var(--accent); }
        .mini-cover {
            width: 44px; height: 44px; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            color: rgba(255,255,255,0.9); flex-shrink: 0;
        }
        .mini-info { flex: 1; min-width: 0; }
        .mini-title { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .mini-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
        .mini-play {
            width: 44px; height: 44px; border-radius: 50%; border: none;
            background: var(--accent); color: #000;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; flex-shrink: 0;
        }

        /* Pantalla de reproducción */
        .full {
            position: fixed; inset: 0; z-index: 100;
            display: flex; flex-direction: column;
            padding: calc(env(safe-area-inset-top, 0px) + 14px) 22px calc(env(safe-area-inset-bottom, 0px) + 22px);
            background: radial-gradient(120% 70% at 50% 0%, var(--glow), var(--bg) 70%);
            transform: translateY(100%);
            visibility: hidden;
            transition: transform 0.38s cubic-bezier(0.2, 0.8, 0.2, 1), visibility 0.38s;
        }
        .full.open { transform: none; visibility: visible; }
        .full-head { display: flex; align-items: center; justify-content: space-between; }
        .head-label { font-size: 13px; color: var(--muted); }
        .cover-wrap { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 16px 0; }
        .cover {
            width: min(78vw, 340px, 42vh); aspect-ratio: 1; border-radius: 24px;
            display: flex; align-items: center; justify-content: center;
            color: rgba(255,255,255,0.9);
            box-shadow: 0 30px 60px rgba(0,0,0,0.45);
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .full.playing .cover { transform: scale(1.03); }
        .cover [data-icon] svg { width: 40% !important; height: 40% !important; }
        .meta { text-align: center; margin-bottom: 18px; min-width: 0; }
        .meta h2 { font-size: 22px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .meta p { font-size: 14px; color: var(--muted); margin-top: 4px; }
        .seek { height: 6px; background: rgba(255,255,255,0.12); border-radius: 3px; cursor: pointer; overflow: hidden; }
        .fill { height: 100%; width: 0; background: var(--accent); }
        .times { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 8px; font-variant-numeric: tabular-nums; }
        .transport { display: flex; align-items: center; justify-content: space-between; margin: 20px 0 22px; }
        .transport .ib { width: 52px; height: 52px; border-radius: 50%; background: transparent; }
        .transport .ib.toggle { color: var(--muted); }
        .transport .ib.toggle.on { color: var(--accent); }
        .transport .ib.play { width: 76px; height: 76px; background: var(--accent); color: #000; }
        .transport .ib.play:hover { color: #000; }
        .volume { display: flex; align-items: center; gap: 12px; color: var(--muted); }
        .volume input { flex: 1; }
    </style>
</head>
<body>

<header class="top">
    <div class="brand">
        <div class="logo" data-icon="note"></div>
        <div>
            <h1>Mauricio</h1>
            <p id="count">Sin canciones</p>
        </div>
    </div>
    <div class="tools">
        <button class="ib" onclick="changeColor()" title="Cambiar color" data-icon="color"></button>
        <button class="ib" onclick="compartir()" title="Compartir canción" data-icon="share"></button>
        <button class="ib" onclick="location.reload()" title="Recargar" data-icon="reload"></button>
        <label class="ib" for="f" title="Cargar carpeta" data-icon="folder"></label>
        <input type="file" id="f" webkitdirectory directory multiple accept=".mp3,.opus,.wav,.m4a,.ogg,.flac">
    </div>
</header>

<div class="search">
    <span class="s-icon" data-icon="search"></span>
    <input id="search" type="search" placeholder="Buscar canción" autocomplete="off">
</div>

<main class="list" id="list"></main>

<div class="mini hidden" id="mini">
    <div class="mini-fill" id="miniFill"></div>
    <div class="mini-cover" id="miniCover"><span data-icon="note"></span></div>
    <div class="mini-info">
        <div class="mini-title" id="miniTitle"></div>
        <div class="mini-sub">Toca para abrir</div>
    </div>
    <button class="mini-play" id="miniPlay" onclick="toggle()" aria-label="Reproducir o pausar"></button>
</div>

<section class="full" id="full" aria-label="Reproductor">
    <div class="full-head">
        <button class="ib" onclick="closeFull()" title="Cerrar" data-icon="down"></button>
        <span class="head-label">Reproduciendo</span>
        <button class="ib" onclick="toggleFull()" title="Pantalla completa" data-icon="full"></button>
    </div>

    <div class="cover-wrap">
        <div class="cover" id="bigCover"><span data-icon="note"></span></div>
    </div>

    <div class="meta">
        <h2 id="bigTitle">Reproductor listo</h2>
        <p id="bigSub">Mauricio Premium</p>
    </div>

    <div class="seek" id="progressBar"><div class="fill" id="progressFill"></div></div>
    <div class="times">
        <span id="currentTime">0:00</span>
        <span id="durationTime">0:00</span>
    </div>

    <div class="transport">
        <button class="ib toggle" id="shufBtn" onclick="toggleShuffle()" title="Aleatorio" data-icon="shuffle"></button>
        <button class="ib" onclick="prev()" title="Anterior" data-icon="prev"></button>
        <button class="ib play" id="bigPlay" onclick="toggle()" title="Reproducir o pausar"></button>
        <button class="ib" onclick="next()" title="Siguiente" data-icon="next"></button>
        <button class="ib toggle" id="repeatBtn" onclick="toggleRepeat()" title="Repetir" data-icon="repeat"></button>
    </div>

    <div class="volume">
        <span data-icon="vol"></span>
        <input type="range" id="volumeBar" min="0" max="100" value="80">
    </div>
</section>

<script>
    const $ = (id) => document.getElementById(id);

    // Íconos (SVG en línea, sin dependencias)
    const ICONS = {
        play:    { f: true,  d: '<path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/>' },
        pause:   { f: true,  d: '<rect x="6" y="5" width="4.5" height="14" rx="1.2"/><rect x="13.5" y="5" width="4.5" height="14" rx="1.2"/>' },
        prev:    { f: true,  d: '<path d="M6 6h2.2v12H6zM19 6.6v10.8a.8.8 0 0 1-1.25.66L9.6 12.66a.8.8 0 0 1 0-1.32l8.15-5.4A.8.8 0 0 1 19 6.6z"/>' },
        next:    { f: true,  d: '<path d="M16 6h2.2v12H16zM5 6.6v10.8a.8.8 0 0 0 1.25.66l8.15-5.4a.8.8 0 0 0 0-1.32L6.25 5.94A.8.8 0 0 0 5 6.6z"/>' },
        shuffle: { d: '<path d="M3 7h3.5c4 0 5.5 10 9.5 10H21M3 17h3.5c1.6 0 2.7-.9 3.6-2.5M14 9.5C14.9 7.9 16 7 17.5 7H21M18 4l3 3-3 3M18 14l3 3-3 3"/>' },
        repeat:  { d: '<path d="M4 11V9a3 3 0 0 1 3-3h13M17 3l3 3-3 3M20 13v2a3 3 0 0 1-3 3H4M7 21l-3-3 3-3"/>' },
        search:  { d: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>' },
        folder:  { d: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>' },
        share:   { d: '<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/>' },
        full:    { d: '<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>' },
        reload:  { d: '<path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/>' },
        color:   { d: '<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/>' },
        down:    { d: '<path d="M6 9l6 6 6-6"/>' },
        vol:     { d: '<path d="M11 5L6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/>' },
        note:    { d: '<path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/>' }
    };

    function icon(name) {
        const it = ICONS[name];
        const attrs = it.f
            ? 'fill="currentColor"'
            : 'fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"';
        return `<svg viewBox="0 0 24 24" width="22" height="22" ${attrs} aria-hidden="true">${it.d}</svg>`;
    }

    // Estado
    let tracks = [], cur = 0, currentUrl = null, wakeLock = null;
    let fadeTimer = null, pauseTimer = null;
    let isShuffle = false, isRepeat = false, colorIndex = 0;
    const COLORS = ['#00ff88', '#56d9ff', '#ffd34d', '#ff7878', '#d18cff', '#0099ff', '#ff9500', '#ff2e96'];

    const audio = new Audio();
    let audioContext, gainNode;

    // Guardar preferencias (si el navegador lo permite)
    const store = {
        get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
        set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
    };

    function displayName(file) {
        const n = typeof file === 'string' ? file : file.name;
        return n.replace(/\.[^.]+$/, '');
    }

    function fmt(seconds) {
        if (!isFinite(seconds)) return "0:00";
        const m = Math.floor(seconds / 60);
        const s = Math.floor(seconds % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
    }

    function currentVolume() { return $('volumeBar').value / 100; }

    // Color de portada derivado del nombre, para que cada canción tenga su propio tono
    function coverFor(name) {
        let h = 0;
        for (const c of name) h = (h * 31 + c.charCodeAt(0)) % 360;
        return {
            bg: `linear-gradient(135deg, hsl(${h} 75% 55%), hsl(${(h + 60) % 360} 70% 28%))`,
            glow: `hsl(${h} 60% 22%)`
        };
    }

    function applyColor() {
        document.documentElement.style.setProperty('--accent', COLORS[colorIndex]);
        store.set('color', colorIndex);
    }

    function changeColor() {
        colorIndex = (colorIndex + 1) % COLORS.length;
        applyColor();
    }

    // Fundido suave con el GainNode
    function fadeTo(vol, ms) {
        const g = gainNode.gain;
        g.cancelScheduledValues(audioContext.currentTime);
        g.setValueAtTime(g.value, audioContext.currentTime);
        g.linearRampToValueAtTime(vol, audioContext.currentTime + ms / 1000);
    }

    function initAudio() {
        if (!audioContext) {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const source = audioContext.createMediaElementSource(audio);
            gainNode = audioContext.createGain();
            gainNode.gain.value = currentVolume();
            source.connect(gainNode);
            gainNode.connect(audioContext.destination);

            // Oscilador inaudible que mantiene el audio vivo en segundo plano (Android)
            const osc = audioContext.createOscillator();
            const g = audioContext.createGain();
            osc.frequency.setValueAtTime(20000, audioContext.currentTime);
            g.gain.setValueAtTime(0.0005, audioContext.currentTime);
            osc.connect(g);
            g.connect(audioContext.destination);
            osc.start();

            setupMediaSession();
        }
        if (audioContext.state === 'suspended') audioContext.resume();
    }

    async function requestWakeLock() {
        try {
            if ('wakeLock' in navigator) {
                if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
                wakeLock = await navigator.wakeLock.request('screen');
                wakeLock.addEventListener('release', () => {
                    if (!audio.paused) setTimeout(requestWakeLock, 800);
                });
            }
        } catch (err) {}
    }

    function releaseWakeLock() {
        if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
    }

    function setupMediaSession() {
        if ('mediaSession' in navigator) {
            navigator.mediaSession.setActionHandler('play', () => { if (audio.paused && currentUrl) toggle(); });
            navigator.mediaSession.setActionHandler('pause', () => { if (!audio.paused) toggle(); });
            navigator.mediaSession.setActionHandler('previoustrack', prev);
            navigator.mediaSession.setActionHandler('nexttrack', () => next());
        }
    }

    function updateMetadata(name) {
        if ('mediaSession' in navigator) {
            navigator.mediaSession.metadata = new MediaMetadata({
                title: name,
                artist: 'Mauricio Premium',
                album: 'Reproductor'
            });
        }
    }

    // Interfaz
    function setPlayingUI() {
        const playing = !audio.paused;
        const ic = icon(playing ? 'pause' : 'play');
        $('miniPlay').innerHTML = ic;
        $('bigPlay').innerHTML = ic;
        $('full').classList.toggle('playing', playing);
        updateRows();
    }

    function updateRows() {
        document.querySelectorAll('.row').forEach(r => {
            const i = +r.dataset.i;
            const on = i === cur && !!currentUrl;
            r.classList.toggle('active', on);
            r.classList.toggle('playing', on && !audio.paused);
        });
    }

    function setNowPlaying(name) {
        const c = coverFor(name);
        $('miniCover').style.background = c.bg;
        $('bigCover').style.background = c.bg;
        $('full').style.setProperty('--glow', c.glow);
        $('miniTitle').textContent = name;
        $('bigTitle').textContent = name;
        $('bigSub').textContent = `${cur + 1} de ${tracks.length}`;
        $('mini').classList.remove('hidden');
    }

    function renderList() {
        const q = $('search').value.trim().toLowerCase();
        const frag = document.createDocumentFragment();
        let count = 0;

        tracks.forEach((t, i) => {
            const label = displayName(t);
            if (q && !label.toLowerCase().includes(q)) return;
            count++;
            const row = document.createElement('div');
            row.className = 'row';
            row.dataset.i = i;
            row.innerHTML = '<div class="idx"><span class="num"></span><span class="eq"><i></i><i></i><i></i></span></div><div class="name"></div>';
            row.querySelector('.num').textContent = i + 1;
            row.querySelector('.name').textContent = label;
            frag.appendChild(row);
        });

        if (count === 0) {
            const d = document.createElement('div');
            d.className = 'empty';
            d.innerHTML = tracks.length
                ? '<b>Sin resultados</b>Prueba con otro nombre.'
                : '<b>Sin canciones</b>Toca el ícono de carpeta para cargar tu música.';
            frag.appendChild(d);
        }

        $('list').replaceChildren(frag);
        $('count').textContent = tracks.length ? `${tracks.length} canciones` : 'Sin canciones';
        updateRows();
    }

    function openFull() {
        if (!currentUrl) return;
        $('full').classList.add('open');
    }

    function closeFull() {
        $('full').classList.remove('open');
    }

    function updateProgress() {
        if (!audio.duration) return;
        const p = (audio.currentTime / audio.duration) * 100;
        $('progressFill').style.width = p + '%';
        $('miniFill').style.width = p + '%';
        $('currentTime').textContent = fmt(audio.currentTime);
        $('durationTime').textContent = fmt(audio.duration);
    }

    function seek(delta) {
        if (!currentUrl) return;
        audio.currentTime = Math.max(0, Math.min(audio.duration || 0, audio.currentTime + delta));
    }

    // Reproducción
    function play(i) {
        if (i < 0 || i >= tracks.length) return;
        initAudio();
        requestWakeLock();
        clearTimeout(fadeTimer);
        clearTimeout(pauseTimer);
        pauseTimer = null;

        fadeTo(0, 150);

        fadeTimer = setTimeout(() => {
            audio.pause();
            if (currentUrl) URL.revokeObjectURL(currentUrl);
            currentUrl = URL.createObjectURL(tracks[i]);
            audio.src = currentUrl;
            cur = i;

            const name = displayName(tracks[i]);
            setNowPlaying(name);
            updateMetadata(name);
            $('progressFill').style.width = '0%';
            $('miniFill').style.width = '0%';
            $('currentTime').textContent = '0:00';
            $('durationTime').textContent = '0:00';
            updateRows();

            const row = document.querySelector(`.row[data-i="${i}"]`);
            if (row) row.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

            audio.play().then(() => fadeTo(currentVolume(), 250)).catch(() => {});
        }, 160);
    }

    function next(auto = false) {
        if (tracks.length === 0) return;
        if (isRepeat) {
            play(cur);
        } else if (isShuffle && tracks.length > 1) {
            let n;
            do { n = Math.floor(Math.random() * tracks.length); } while (n === cur);
            play(n);
        } else if (cur + 1 < tracks.length) {
            play(cur + 1);
        } else if (!auto) {
            play(0); // el botón siguiente da la vuelta a la lista
        }
        // Al terminar la última canción de la lista, se detiene solo
    }

    function prev() {
        if (tracks.length === 0) return;
        if (audio.currentTime > 3) {
            audio.currentTime = 0;
            return;
        }
        play((cur - 1 + tracks.length) % tracks.length);
    }

    function toggle() {
        if (!currentUrl) return;
        initAudio();

        // Si había una pausa pendiente, se cancela y sigue sonando
        if (pauseTimer) {
            clearTimeout(pauseTimer);
            pauseTimer = null;
            fadeTo(currentVolume(), 150);
            return;
        }

        if (audio.paused) {
            fadeTo(currentVolume(), 150);
            audio.play().catch(() => {});
        } else {
            fadeTo(0, 150);
            pauseTimer = setTimeout(() => {
                pauseTimer = null;
                audio.pause();
            }, 160);
        }
    }

    function toggleShuffle() {
        isShuffle = !isShuffle;
        $('shufBtn').classList.toggle('on', isShuffle);
        if (isShuffle && isRepeat) toggleRepeat();
    }

    function toggleRepeat() {
        isRepeat = !isRepeat;
        $('repeatBtn').classList.toggle('on', isRepeat);
        if (isRepeat && isShuffle) toggleShuffle();
    }

    function toggleFull() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(() => {});
        } else {
            document.exitFullscreen();
        }
    }

    async function compartir() {
        if (tracks.length === 0) return;
        const file = tracks[cur];
        try {
            const fileToShare = new File([file], file.name, { type: file.type });
            if (navigator.canShare && navigator.canShare({ files: [fileToShare] })) {
                await navigator.share({ files: [fileToShare] });
            } else {
                alert("Este navegador no permite compartir archivos de audio. Prueba con Chrome en Android.");
            }
        } catch (e) {}
    }

    // Eventos del audio
    audio.onplay = () => { setPlayingUI(); requestWakeLock(); };
    audio.onpause = () => { setPlayingUI(); releaseWakeLock(); };
    audio.onended = () => next(true);
    audio.ontimeupdate = updateProgress;
    audio.onloadedmetadata = updateProgress;

    // Carga de carpeta
    $('f').onchange = (e) => {
        const files = Array.from(e.target.files).filter(f => /\.(mp3|opus|wav|m4a|ogg|flac)$/i.test(f.name));
        e.target.value = '';
        if (files.length > 0) {
            tracks = files;
            cur = 0;
            $('search').value = '';
            renderList();
            play(0);
        }
    };

    // Búsqueda
    $('search').addEventListener('input', renderList);

    // Tocar una canción de la lista
    $('list').addEventListener('click', (e) => {
        const row = e.target.closest('.row');
        if (row) play(+row.dataset.i);
    });

    // Mini reproductor abre la vista completa (menos el botón de play)
    $('mini').addEventListener('click', (e) => {
        if (e.target.closest('#miniPlay')) return;
        openFull();
    });

    // Barra de progreso y volumen
    $('progressBar').addEventListener('click', (e) => {
        if (!audio.duration) return;
        const rect = $('progressBar').getBoundingClientRect();
        audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
    });

    $('volumeBar').addEventListener('input', () => {
        if (gainNode) gainNode.gain.value = currentVolume();
        store.set('vol', $('volumeBar').value);
    });

    // Teclado: espacio = play/pausa, flechas = avanzar/retroceder 5 s, Escape cierra la vista completa
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') { closeFull(); return; }
        if (e.target.tagName === 'INPUT') return;
        if (e.code === 'Space') { e.preventDefault(); toggle(); }
        if (e.code === 'ArrowRight') seek(5);
        if (e.code === 'ArrowLeft') seek(-5);
    });

    // Inicio
    document.querySelectorAll('[data-icon]').forEach(el => { el.innerHTML = icon(el.dataset.icon); });
    $('volumeBar').value = store.get('vol', 80);
    colorIndex = +store.get('color', 0) || 0;
    applyColor();
    setPlayingUI();
    renderList();
</script>
</body>
</html>
