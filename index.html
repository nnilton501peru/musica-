<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NILTON PREMIUM V47 - FULL CONTROL</title>
    <style>
        :root { --neon: #00ff88; --bg: #080808; --panel: #121212; --glass: rgba(255, 255, 255, 0.05); }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        html, body { height: 100%; width: 100%; background: var(--bg); color: white; font-family: sans-serif; overflow: hidden; }
        body { display: flex; flex-direction: column; }
        .header { background: var(--panel); padding: 15px; border-bottom: 1px solid #222; flex-shrink: 0; z-index: 10; width: 100%; }
        .full-btn { background: transparent; border: none; color: #bbb; font-size: 9px; font-weight: bold; text-transform: uppercase; margin-bottom: 8px; width: 100%; }
        .custom-file-upload { display: block; width: 100%; padding: 12px; background: linear-gradient(145deg, #1e1e1e, #111); color: var(--neon); border: 1px solid #333; border-radius: 12px; text-align: center; font-weight: bold; margin-bottom: 10px; font-size: 14px; }
        .title-card { display: flex; align-items: center; background: #000; border-radius: 15px; padding: 10px; margin-bottom: 10px; border: 1px solid #222; overflow: hidden; }
        .marquee-box { flex-grow: 1; overflow: hidden; white-space: nowrap; position: relative; margin: 0 10px; }
        #title { display: inline-block; padding-left: 100%; animation: scroll 12s linear infinite; font-size: 14px; font-weight: bold; color: #fff; }
        @keyframes scroll { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }
        .controls { display: flex; justify-content: space-around; align-items: center; padding: 5px; }
        .btn-tool { background: var(--glass); color: white; border: 1px solid #333; width: 35px; height: 35px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        .active-tool { color: var(--neon); border-color: var(--neon); box-shadow: 0 0 10px var(--neon); }
        .btn { background: #1a1a1a; border: 1px solid #333; color: white; width: 50px; height: 50px; border-radius: 50%; font-size: 18px; box-shadow: 3px 3px 8px #000; }
        .btn-p { background: var(--neon); color: #000; border: none; width: 65px; height: 65px; font-size: 25px; }
        #list { flex-grow: 1; overflow-y: auto; padding: 10px; background: var(--bg); -webkit-overflow-scrolling: touch; }
        .item { padding: 18px; border-bottom: 1px solid #161616; font-size: 17px; color: #777; border-radius: 10px; margin-bottom: 5px; }
        .item.active { color: var(--neon); background: var(--glass); font-weight: bold; border-left: 4px solid var(--neon); }
        input[type="file"] { display: none; }
    </style>
</head>
<body>

<div class="header">
    <button class="full-btn" onclick="toggleFull()">[ PANTALLA COMPLETA ]</button>
    <label for="f" class="custom-file-upload">📁 CARGAR CARPETA</label>
    <input type="file" id="f" webkitdirectory directory multiple>
    
    <div class="title-card">
        <button class="btn-tool" onclick="changeColor()">🌈</button>
        <div class="marquee-box"><div id="title">NILTON PREMIUM - LISTO</div></div>
        <button class="btn-tool" id="shufBtn" onclick="toggleShuffle()">🔀</button>
    </div>

    <div class="controls">
        <button class="btn" onclick="prev()">⏮</button>
        <button class="btn btn-p" id="pB" onclick="toggle()">▶</button>
        <button class="btn" onclick="next()">⏭</button>
        <button class="btn-tool" onclick="compartir()">📤</button>
    </div>
</div>

<div id="list"></div>

<script>
    let tracks = [], cur = 0, currentUrl = null, colorIndex = 0, isShuffle = false, wakeLock = null;
    const colors = ['#00ff88', '#d18cff', '#56d9ff', '#ff7878', '#ffd34d'];
    const audio = new Audio();
    let audioContext, gainNode, source;

    // BLOQUEO DE PANTALLA (Para que no se apague sola)
    async function requestWakeLock() {
        try {
            if ('wakeLock' in navigator) {
                wakeLock = await navigator.wakeLock.request('screen');
            }
        } catch (err) {}
    }

    function initAudio() {
        if (!audioContext) {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            source = audioContext.createMediaElementSource(audio);
            gainNode = audioContext.createGain();
            source.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            // OSCILADOR INAUDIBLE (Engaño para Android)
            const osc = audioContext.createOscillator();
            const g = audioContext.createGain();
            osc.frequency.setValueAtTime(20000, audioContext.currentTime);
            g.gain.setValueAtTime(0.001, audioContext.currentTime);
            osc.connect(g); g.connect(audioContext.destination);
            osc.start();

            setupMediaSession();
        }
    }

    function setupMediaSession() {
        if ('mediaSession' in navigator) {
            navigator.mediaSession.setActionHandler('play', () => toggle());
            navigator.mediaSession.setActionHandler('pause', () => toggle());
            navigator.mediaSession.setActionHandler('previoustrack', () => prev());
            navigator.mediaSession.setActionHandler('nexttrack', () => next());
        }
    }

    function updateMetadata(name) {
        if ('mediaSession' in navigator) {
            navigator.mediaSession.metadata = new MediaMetadata({
                title: name,
                artist: 'Nilton Premium',
                album: 'Tacna'
            });
        }
    }

    document.getElementById('f').onchange = (e) => {
        const files = Array.from(e.target.files).filter(file => file.name.match(/\.(mp3|opus|wav|m4a|ogg)$/i));
        if(files.length > 0) { tracks = files; render(); play(0); }
    };

    function render() {
        const l = document.getElementById('list'); l.innerHTML = '';
        tracks.forEach((track, i) => {
            const div = document.createElement('div');
            div.className = 'item'; div.id = 'tr' + i;
            div.innerText = (i + 1) + ". " + track.name;
            div.onclick = () => play(i);
            l.appendChild(div);
        });
    }

    function play(i) {
        if(i < 0 || i >= tracks.length) return;
        initAudio();
        requestWakeLock(); // Activamos el bloqueo de pantalla al dar Play

        gainNode.gain.setValueAtTime(gainNode.gain.value, audioContext.currentTime);
        gainNode.gain.linearRampToValueAtTime(0, audioContext.currentTime + 0.04);

        setTimeout(() => {
            audio.pause();
            if(currentUrl) URL.revokeObjectURL(currentUrl);
            currentUrl = URL.createObjectURL(tracks[i]);
            audio.src = currentUrl; cur = i;
            document.getElementById('title').innerText = tracks[i].name;
            updateMetadata(tracks[i].name);
            
            document.querySelectorAll('.item').forEach(el => el.classList.remove('active'));
            const active = document.getElementById('tr' + i);
            if(active) { active.classList.add('active'); active.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
            
            audio.play().then(() => {
                document.getElementById('pB').innerText = "⏸";
                gainNode.gain.linearRampToValueAtTime(1, audioContext.currentTime + 0.15);
            }).catch(() => {});
        }, 50);
    }

    function next() {
        if(isShuffle && tracks.length > 1) {
            let n; do { n = Math.floor(Math.random() * tracks.length); } while(n === cur);
            play(n);
        } else { play((cur + 1) % tracks.length); }
    }

    function prev() { play((cur - 1 + tracks.length) % tracks.length); }
    
    function toggle() { 
        initAudio(); 
        if(audio.paused) { audio.play(); document.getElementById('pB').innerText = "⏸"; requestWakeLock(); }
        else { audio.pause(); document.getElementById('pB').innerText = "▶"; if(wakeLock) { wakeLock.release(); wakeLock = null; } }
    }

    function changeColor() { 
        colorIndex = (colorIndex + 1) % colors.length; 
        document.documentElement.style.setProperty('--neon', colors[colorIndex]); 
    }

    function toggleShuffle() { 
        isShuffle = !isShuffle; 
        document.getElementById('shufBtn').classList.toggle('active-tool', isShuffle); 
    }

    function toggleFull() {
        if (!document.fullscreenElement) { document.documentElement.requestFullscreen().catch(() => {}); }
        else { document.exitFullscreen(); }
    }
    
    audio.onended = next;

    async function compartir() {
        if (tracks.length === 0) return;
        const file = tracks[cur];
        try {
            const fileToShare = new File([file], file.name, { type: file.type });
            if (navigator.canShare && navigator.canShare({ files: [fileToShare] })) {
                await navigator.share({ files: [fileToShare] });
            }
        } catch (e) {}
    }
</script>
</body>
</html>
