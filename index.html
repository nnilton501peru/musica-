<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mauricio - Premium 5.5</title>
    <style>
        :root { --neon: #00ff88; --bg: #080808; --panel: #121212; --glass: rgba(255, 255, 255, 0.05); }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        html, body { height: 100%; width: 100%; background: var(--bg); color: #fff; font-family: sans-serif; overflow: hidden; }
        body { display: flex; flex-direction: column; }
        button { font-family: inherit; }

        /* Barra superior */
        .top-bar {
            background: var(--panel);
            padding: 12px 14px;
            border-bottom: 1px solid #222;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            z-index: 30;
            flex-shrink: 0;
        }
        .app-title { font-size: 16px; font-weight: 600; color: #eee; }
        .actions { display: flex; gap: 8px; align-items: center; }
        .icon-btn {
            background: var(--glass);
            border: 1px solid #333;
            color: #fff;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .icon-btn:hover, .icon-btn:active { color: var(--neon); border-color: var(--neon); }

        /* Menú desplegable */
        .dropdown-menu {
            position: absolute;
            top: calc(100% + 6px);
            right: 14px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
            width: 230px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: none;
            z-index: 40;
            overflow: hidden;
        }
        .dropdown-menu.show { display: block; }
        .menu-item {
            padding: 14px 18px;
            color: #eee;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .menu-item:hover { background: #252525; color: var(--neon); }
        .volume-section { padding: 14px 18px; border-top: 1px solid #2a2a2a; }
        .volume-label { font-size: 15px; color: #ccc; margin-bottom: 8px; }
        .volume-bar {
            width: 100%;
            height: 6px;
            background: #2a2a2a;
            border-radius: 3px;
            outline: none;
            -webkit-appearance: none;
            cursor: pointer;
        }
        .volume-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--neon);
        }
        .volume-bar::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--neon);
            border: none;
        }

        /* Lista de canciones (protagonista) */
        #list { flex-grow: 1; overflow-y: auto; padding: 10px; -webkit-overflow-scrolling: touch; }
        .empty {
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #666;
            font-size: 15px;
            text-align: center;
            padding: 20px;
            gap: 8px;
        }
        .empty b { color: #aaa; font-weight: 500; }
        .item {
            padding: 14px;
            font-size: 16px;
            color: #888;
            border-radius: 10px;
            margin-bottom: 4px;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .item:hover { background: rgba(255,255,255,0.03); }
        .item.active {
            color: var(--neon);
            background: var(--glass);
            font-weight: bold;
            border-left: 4px solid var(--neon);
            padding-left: 10px;
        }

        /* Reproductor inferior */
        .player {
            background: var(--panel);
            border-top: 1px solid #222;
            padding: 12px 16px calc(14px + env(safe-area-inset-bottom, 0px));
            flex-shrink: 0;
            z-index: 20;
        }
        .now { display: flex; align-items: center; margin-bottom: 10px; }
        .marquee-box { flex-grow: 1; overflow: hidden; white-space: nowrap; }
        #title {
            display: inline-block;
            padding-left: 100%;
            animation: scroll 12s linear infinite;
            font-size: 15px;
            font-weight: 500;
            color: #fff;
        }
        @keyframes scroll { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }
        .progress-row { display: flex; align-items: center; gap: 10px; font-size: 12px; color: #999; margin-bottom: 12px; }
        .progress-bar { flex-grow: 1; height: 6px; background: #222; border-radius: 3px; overflow: hidden; cursor: pointer; }
        .progress-fill { height: 100%; background: var(--neon); width: 0%; }
        .controls { display: flex; justify-content: space-between; align-items: center; }
        .btn {
            background: #1a1a1a;
            border: 1px solid #333;
            color: #fff;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            font-size: 17px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .btn:active { transform: scale(0.95); }
        .btn-p {
            background: var(--neon);
            color: #000;
            border: none;
            width: 64px;
            height: 64px;
            font-size: 24px;
            font-weight: bold;
        }
        .active-tool { color: var(--neon); border-color: var(--neon); }

        input[type="file"] { display: none; }
    </style>
</head>
<body>

<div class="top-bar">
    <div class="app-title">Mauricio · Premium 5.5</div>
    <div class="actions">
        <button class="icon-btn" title="Cambiar color" onclick="changeColor()">🌈</button>
        <button class="icon-btn" title="Pantalla completa" onclick="toggleFull()">⛶</button>
        <button class="icon-btn" id="menuBtn" title="Menú">⋮</button>
        <div class="dropdown-menu" id="dropdownMenu">
            <label for="f" class="menu-item">📁 Cargar carpeta</label>
            <input type="file" id="f" webkitdirectory directory multiple accept=".mp3,.opus,.wav,.m4a,.ogg,.flac">
            <div class="menu-item" onclick="recargarPagina()">🔄 Recargar página</div>
            <div class="menu-item" onclick="compartir()">⤴️ Compartir canción</div>
            <div class="volume-section">
                <div class="volume-label">🔊 Volumen</div>
                <input type="range" class="volume-bar" id="volumeBar" min="0" max="100" value="80">
            </div>
        </div>
    </div>
</div>

<div id="list">
    <div class="empty" id="emptyState">
        <b>Sin canciones</b>
        Toca ⋮ y elige "Cargar carpeta" para empezar.
    </div>
</div>

<div class="player">
    <div class="now">
        <div class="marquee-box"><span id="title">Reproductor listo para usar</span></div>
    </div>
    <div class="progress-row">
        <span id="currentTime">00:00</span>
        <div class="progress-bar" id="progressBar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <span id="durationTime">00:00</span>
    </div>
    <div class="controls">
        <button class="btn" id="shufBtn" title="Aleatorio" onclick="toggleShuffle()">🔀</button>
        <button class="btn" title="Anterior" onclick="prev()">⏮</button>
        <button class="btn btn-p" id="pB" title="Reproducir o pausar" onclick="toggle()">▷</button>
        <button class="btn" title="Siguiente" onclick="next()">⏭</button>
        <button class="btn" id="repeatBtn" title="Repetir" onclick="toggleRepeat()">🔁</button>
    </div>
</div>

<script>
    let tracks = [], cur = 0, currentUrl = null, colorIndex = 0;
    let isShuffle = false, isRepeat = false, wakeLock = null;
    let fadeTimer = null, pauseTimer = null;

    const colors = ['#00ff88', '#56d9ff', '#ffd34d', '#ff7878', '#d18cff', '#0099ff', '#ff9500', '#ff2e96'];

    const audio = new Audio();
    let audioContext, gainNode, source;

    const titleEl = document.getElementById('title');
    const progressBar = document.getElementById('progressBar');
    const progressFill = document.getElementById('progressFill');
    const currentTimeEl = document.getElementById('currentTime');
    const durationTimeEl = document.getElementById('durationTime');
    const volumeBar = document.getElementById('volumeBar');
    const menuBtn = document.getElementById('menuBtn');
    const dropdownMenu = document.getElementById('dropdownMenu');
    const repeatBtn = document.getElementById('repeatBtn');
    const shufBtn = document.getElementById('shufBtn');
    const playBtn = document.getElementById('pB');

    function recargarPagina() {
        window.location.reload();
    }

    menuBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        dropdownMenu.classList.toggle('show');
    });
    document.addEventListener('click', () => dropdownMenu.classList.remove('show'));
    dropdownMenu.addEventListener('click', (e) => e.stopPropagation());

    function formatTime(seconds) {
        if (isNaN(seconds)) return "00:00";
        const min = Math.floor(seconds / 60);
        const sec = Math.floor(seconds % 60);
        return `${min.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;
    }

    function currentVolume() {
        return volumeBar.value / 100;
    }

    function setPlayIcon(playing) {
        playBtn.innerText = playing ? "⏸" : "▷";
    }

    // Volumen y fundido suave, usando el GainNode (el volumen del <audio> se deja en 1)
    function fadeTo(vol, ms) {
        const g = gainNode.gain;
        g.cancelScheduledValues(audioContext.currentTime);
        g.setValueAtTime(g.value, audioContext.currentTime);
        g.linearRampToValueAtTime(vol, audioContext.currentTime + ms / 1000);
    }

    function updateProgress() {
        if (!audio.duration) return;
        const percent = (audio.currentTime / audio.duration) * 100;
        progressFill.style.width = percent + "%";
        currentTimeEl.textContent = formatTime(audio.currentTime);
        durationTimeEl.textContent = formatTime(audio.duration);
    }

    progressBar.addEventListener('click', (e) => {
        if (!audio.duration) return;
        const rect = progressBar.getBoundingClientRect();
        const percent = (e.clientX - rect.left) / rect.width;
        audio.currentTime = percent * audio.duration;
    });

    volumeBar.addEventListener('input', () => {
        if (gainNode) gainNode.gain.value = currentVolume();
    });

    async function requestWakeLock() {
        try {
            if ('wakeLock' in navigator) {
                if (wakeLock) {
                    wakeLock.release().catch(() => {});
                    wakeLock = null;
                }
                wakeLock = await navigator.wakeLock.request('screen');
                wakeLock.addEventListener('release', () => {
                    if (!audio.paused) setTimeout(requestWakeLock, 800);
                });
            }
        } catch (err) {}
    }

    function releaseWakeLock() {
        if (wakeLock) {
            wakeLock.release().catch(() => {});
            wakeLock = null;
        }
    }

    function initAudio() {
        if (!audioContext) {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            source = audioContext.createMediaElementSource(audio);
            gainNode = audioContext.createGain();
            gainNode.gain.value = currentVolume();
            source.connect(gainNode);
            gainNode.connect(audioContext.destination);

            // Oscilador inaudible que mantiene el audio vivo en segundo plano (Android)
            const osc = audioContext.createOscillator();
            const g = audioContext.createGain();
            osc.frequency.setValueAtTime(20000, audioContext.currentTime);
            g.gain.setValueAtTime(0.0005, audioContext.currentTime);
            osc.connect(g);
            g.connect(audioContext.destination);
            osc.start();

            setupMediaSession();
        }
        if (audioContext.state === 'suspended') audioContext.resume();
    }

    function setupMediaSession() {
        if ('mediaSession' in navigator) {
            navigator.mediaSession.setActionHandler('play', () => { if (audio.paused && currentUrl) toggle(); });
            navigator.mediaSession.setActionHandler('pause', () => { if (!audio.paused) toggle(); });
            navigator.mediaSession.setActionHandler('previoustrack', prev);
            navigator.mediaSession.setActionHandler('nexttrack', () => next());
        }
    }

    function updateMetadata(name) {
        if ('mediaSession' in navigator) {
            navigator.mediaSession.metadata = new MediaMetadata({
                title: name,
                artist: 'Mauricio Premium',
                album: 'Reproductor'
            });
        }
    }

    // Eventos del audio: el icono de play siempre refleja el estado real
    audio.onplay = () => { setPlayIcon(true); requestWakeLock(); };
    audio.onpause = () => { setPlayIcon(false); releaseWakeLock(); };
    audio.onended = () => next(true);
    audio.ontimeupdate = updateProgress;

    document.getElementById('f').onchange = (e) => {
        try {
            const files = Array.from(e.target.files).filter(file =>
                file.name.match(/\.(mp3|opus|wav|m4a|ogg|flac)$/i)
            );
            dropdownMenu.classList.remove('show');
            if (files.length > 0) {
                tracks = files;
                render();
                play(0);
            }
        } catch (err) {
            console.log("Error al cargar archivos:", err);
        }
    };

    function render() {
        const l = document.getElementById('list');
        l.innerHTML = '';
        tracks.forEach((track, i) => {
            const div = document.createElement('div');
            div.className = 'item';
            div.id = 'tr' + i;
            div.innerText = (i + 1) + ". " + track.name;
            div.onclick = () => play(i);
            l.appendChild(div);
        });
    }

    function play(i) {
        if (i < 0 || i >= tracks.length) return;
        initAudio();
        requestWakeLock();
        clearTimeout(fadeTimer);
        clearTimeout(pauseTimer);
        pauseTimer = null;

        fadeTo(0, 150);

        fadeTimer = setTimeout(() => {
            audio.pause();
            if (currentUrl) URL.revokeObjectURL(currentUrl);
            currentUrl = URL.createObjectURL(tracks[i]);
            audio.src = currentUrl;
            cur = i;

            const name = tracks[i].name;
            titleEl.innerText = name;
            updateMetadata(name);
            progressFill.style.width = '0%';
            currentTimeEl.textContent = '00:00';
            durationTimeEl.textContent = '00:00';

            document.querySelectorAll('.item').forEach(el => el.classList.remove('active'));
            const active = document.getElementById('tr' + i);
            if (active) {
                active.classList.add('active');
                active.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }

            audio.play().then(() => fadeTo(currentVolume(), 250)).catch(() => {});
        }, 160);
    }

    function next(auto = false) {
        if (tracks.length === 0) return;
        if (isRepeat) {
            play(cur);
        } else if (isShuffle && tracks.length > 1) {
            let n;
            do {
                n = Math.floor(Math.random() * tracks.length);
            } while (n === cur);
            play(n);
        } else if (cur + 1 < tracks.length) {
            play(cur + 1);
        } else if (!auto) {
            play(0); // el botón siguiente da la vuelta a la lista
        }
        // Si terminó la última canción de la lista, se detiene solo
    }

    function prev() {
        if (tracks.length === 0) return;
        // Si ya va avanzada, la regresa al inicio; si no, va a la anterior
        if (audio.currentTime > 3) {
            audio.currentTime = 0;
            return;
        }
        play((cur - 1 + tracks.length) % tracks.length);
    }

    function toggle() {
        if (!currentUrl) return;
        initAudio();

        // Si se pidió pausa hace poco y todavía no se pausó, se cancela y sigue sonando
        if (pauseTimer) {
            clearTimeout(pauseTimer);
            pauseTimer = null;
            fadeTo(currentVolume(), 150);
            return;
        }

        if (audio.paused) {
            fadeTo(currentVolume(), 150);
            audio.play().catch(() => {});
        } else {
            fadeTo(0, 150);
            pauseTimer = setTimeout(() => {
                pauseTimer = null;
                audio.pause();
            }, 160);
        }
    }

    function changeColor() {
        colorIndex = (colorIndex + 1) % colors.length;
        document.documentElement.style.setProperty('--neon', colors[colorIndex]);
    }

    function toggleShuffle() {
        isShuffle = !isShuffle;
        shufBtn.classList.toggle('active-tool', isShuffle);
        if (isShuffle && isRepeat) toggleRepeat();
    }

    function toggleRepeat() {
        isRepeat = !isRepeat;
        repeatBtn.classList.toggle('active-tool', isRepeat);
        if (isRepeat && isShuffle) toggleShuffle();
    }

    function toggleFull() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(() => {});
        } else {
            document.exitFullscreen();
        }
    }

    async function compartir() {
        if (tracks.length === 0) return;
        const file = tracks[cur];
        try {
            const fileToShare = new File([file], file.name, { type: file.type });
            if (navigator.canShare && navigator.canShare({ files: [fileToShare] })) {
                await navigator.share({ files: [fileToShare] });
            } else {
                alert("Este navegador no permite compartir archivos de audio. Prueba con Chrome en Android.");
            }
        } catch (e) {}
    }
</script>
</body>
</html>
